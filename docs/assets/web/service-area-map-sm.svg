<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 760" role="img" aria-labelledby="mapTitle mapDesc" style="width:100%;height:auto;display:block;border-radius:12px">
<title id="mapTitle">Where DS Handymen works across Western New York</title>
<desc id="mapDesc">A map of Erie County and the surrounding Western New York counties, with Lake Erie to the west. Hamburg, Blasdell, Orchard Park and Lackawanna sit at the centre of the service area and are marked in gold. Surrounding towns are marked with dots that get smaller and fainter with distance from the shop in Blasdell, out through West Seneca, Eden, Boston, East Aurora, Angola and Springville.</desc>
